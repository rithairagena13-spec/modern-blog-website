<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>SortSphere</title>
</head>
<body   class="bg-zinc-100 text-zinc-900">

    
    <!-- NAVIGATION -->
    <nav class="bg-zinc-950 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="#" class="text-2xl font-bold">
                <i class="fa-solid fa-trophy text-white mr-2"></i>
                Sport<span class="text-zinc-400">Sphere</span>
            </a>

            <div class="hidden md:flex items-center gap-8">
                <a href="#" class="hover:text-zinc-400 transition">Home</a>
                <a href="#sports" class="hover:text-zinc-400 transition">Sports</a>
                <a href="#events" class="hover:text-zinc-400 transition">Events</a>
                <a href="#" class="hover:text-zinc-400 transition">Teams</a>
                <a href="#" class="hover:text-zinc-400 transition">News</a>
            </div>

            <button class="bg-white text-zinc-950 hover:bg-zinc-200 px-5 py-2 rounded-full font-semibold transition">
                Explore
            </button>

        </div>
    </nav>

 <!-- HERO BANNER -->
    <section class="relative min-h-600px flex items-center bg-cover bg-center">
       <img src="/images/banner.avif" alt="sports profile" class="absolute inset-0 w-full h-full object-cover">
       <div class="absolute inset-0 bg-zinc-950/40"></div>

        <!-- HERO CONTENT -->
        <div class="relative max-w-7xl mx-auto px-6 py-20 w-full">

            <div class="max-w-3xl text-white">

                <span class="inline-block bg-white/10 border border-white/30 text-white px-4 py-2 rounded-full text-sm font-semibold mb-6">
                    <i class="fa-solid fa-bolt mr-2"></i>
                    Your World of Sports
                </span>

                <h1 class="text-5xl md:text-7xl font-extrabold leading-tight mb-6">
                    Discover.
                    <span class="text-zinc-300">Play.</span>
                    Compete.
                </h1>

                <p class="text-lg md:text-xl text-zinc-300 mb-8 max-w-2xl">
                    Discover sports events, teams, competitions,
                    training opportunities and the latest sports news
                    all in one place.
                </p>

                <div class="flex flex-wrap gap-4">

                    <a
                        href="#sports"
                        class="bg-white text-zinc-950 hover:bg-zinc-200 px-7 py-3 rounded-full font-semibold transition"
                    >
                        Explore Sports
                        <i class="fa-solid fa-arrow-right ml-2"></i>
                    </a>

                    <a
                        href="#events"
                        class="border border-white/50 hover:bg-white hover:text-zinc-950 px-7 py-3 rounded-full font-semibold transition"
                    >
                        Upcoming Events
                    </a>

                </div>

            </div>

        </div>
    </section>


</body>

</html>
